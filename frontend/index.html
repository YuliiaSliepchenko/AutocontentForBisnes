<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoContent</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><main><header><p class="eyebrow">AUTOCONTENT</p><h1>Контент для вашого бізнесу</h1><p class="notice">Тестовий режим: mock-сценарії та зображення. Реальні AI API не підключені.</p></header>
<section id="welcome"><form id="start"><label>Що хочете створити? Якщо вже знаєте нішу чи тему, напишіть одразу.<textarea id="first-message" placeholder="Наприклад: Ніша: кав’ярня; тема: нові сніданки; потрібна карусель"></textarea></label><button>Почати</button></form></section>
<details><summary>Відкрити збережений проєкт</summary><form id="restore"><label>ID проєкту<input id="project-id" required></label><button>Відкрити</button></form></details>
<p id="error" role="alert"></p><button id="retry" hidden>Повторити незавершений запит</button><button id="refresh">Оновити стан і скинути застарілий запит</button>
<section id="workspace" hidden><p id="message" aria-live="polite"></p><div id="content"></div><div id="actions"></div><small id="saved"></small></section><button id="new" class="secondary">Новий проєкт</button>
</main></body></html>
